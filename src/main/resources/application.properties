spring.application.name=pharmasync

spring.datasource.url=jdbc:mysql://localhost:3306/pharmasync?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Epic 2 - how many days before expiry a batch starts showing as "expiring soon",
# unless the product overrides it with its own expiry_warning_days.
pharmasync.inventory.default-expiry-warning-days=30